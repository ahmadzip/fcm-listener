[package]
name = "fcm-listener"
version = "0.1.0"
edition = "2024"

[lints.rust]
linker_messages = "allow"

[profile.dev]
debug = 0

[dependencies]
fcm_receiver_rs = { git = "https://github.com/ahmadzip/fcm_receiver.rs" }
dotenvy = "0.15.7"
openssl = { version = "0.10.81", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
